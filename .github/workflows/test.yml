name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  checks: write # required by dorny/test-reporter
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn -B test
        continue-on-error: true # let the reporter step always run

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Tests
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload Extent report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extent-spark-report
          path: CICD.testReport/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload TestNG output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testng-output
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
