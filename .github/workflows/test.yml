name: Selenium Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Resolve Maven dependencies
        run: mvn -B dependency:resolve

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn -B test
        continue-on-error: true # the report stage decides pass or fail

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload Extent report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extent-spark-report
          path: CICD.testReport/
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Publish Results
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports

      - name: Publish test results
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Tests
          # TEST-*.xml only: the folder also holds testng-results.xml, which isn't JUnit format
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: true

  notify:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [test, report]
    if: always()
    steps:
      - name: Summary
        env:
          TEST_RESULT: ${{ needs.test.result }}
          REPORT_RESULT: ${{ needs.report.result }}
        run: |
          echo "## Pipeline Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Test stage: $TEST_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Report stage: $REPORT_RESULT" >> "$GITHUB_STEP_SUMMARY"
